name: AI GTM Report Daily

on:
  schedule:
    - cron: '0 11 * * *'  # Runs at 11:00 UTC = 13:00 CET (1pm Madrid)
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dateutil
      
      - name: Run scraper (24h window)
        run: python scraper_twitter_hiring.py days_ago=1
        
      - name: Generate filtered report
        run: python generate_report.py
        
      - name: Update index and deploy
        run: python update_index.py
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          branch: gh-pages
